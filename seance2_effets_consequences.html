<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Effets et conséquences</title>
<style>
  :root {
    --fond: #FFF8EE;
    --carte: #FFFFFF;
    --orange: #F5A04A;
    --orange-clair: #FDEBD0;
    --bleu: #1F4E79;
    --vert: #2E8B57;
    --vert-clair: #D5F5E3;
    --alerte: #C96A00;
    --alerte-clair: #FFE8CC;
    --texte: #222222;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 21px; line-height: 1.6;
    background: var(--fond); color: var(--texte);
  }
  main { max-width: 820px; margin: 0 auto; }
  header.titre {
    background: var(--orange-clair); border: 3px solid var(--orange);
    border-radius: 16px; padding: 14px 20px; margin-bottom: 18px;
  }
  header.titre h1 { margin: 0; font-size: 30px; }
  header.titre p { margin: 4px 0 0; font-size: 20px; }
  .carte {
    background: var(--carte); border: 2px solid #D9C3A5;
    border-radius: 16px; padding: 18px 22px; margin-bottom: 16px;
  }
  .modalite { font-weight: bold; color: var(--bleu); }
  .barre { display: flex; gap: 6px; margin-bottom: 14px; }
  .barre span { flex: 1; height: 14px; border-radius: 7px; background: #E8DCC8; }
  .barre span.fait { background: var(--vert); }
  .barre span.courant { background: var(--orange); }
  button, .bouton {
    font-family: inherit; font-size: 21px;
    min-height: 64px; padding: 12px 20px;
    border-radius: 14px; border: 3px solid var(--bleu);
    background: #FFFFFF; color: var(--texte);
    cursor: pointer; text-align: left; width: 100%;
    display: block; text-decoration: none;
  }
  button:hover, .bouton:hover { background: #EAF2FB; }
  button:focus-visible, input:focus-visible { outline: 4px solid #FFB74D; outline-offset: 2px; }
  .principal { background: var(--bleu); color: #FFFFFF; text-align: center; font-weight: bold; }
  .principal:hover { background: #17395A; }
  .petit { width: auto; display: inline-block; min-height: 52px; font-size: 19px; margin: 4px 8px 4px 0; text-align: center; }
  .reponse.juste { background: var(--vert-clair); border-color: var(--vert); font-weight: bold; }
  .reponse.faux { background: var(--alerte-clair); border-color: var(--alerte); }
  .reponse[disabled] { cursor: default; }
  .retour { margin: 10px 0; font-weight: bold; min-height: 34px; }
  .retour.ok { color: var(--vert); }
  .retour.non { color: var(--alerte); }
  .aide { background: #FFF8DC; border: 2px dashed #D8B94A; border-radius: 12px; padding: 10px 14px; margin: 10px 0; }
  .cache { display: none; }
  h2 { font-size: 26px; margin: 0 0 8px; }
  .mot { font-size: 30px; font-weight: bold; color: var(--bleu); }
  .scene { font-size: 64px; text-align: center; margin: 4px 0; line-height: 1.2; }
  .temoignage { font-size: 24px; font-style: italic; border-left: 6px solid var(--orange); padding-left: 14px; margin: 10px 0 14px; }
  .ligne { display: flex; gap: 10px; align-items: stretch; margin: 12px 0; }
  .ligne .reponse { margin: 0; flex: 1; }
  .ecoute {
    width: 72px; min-width: 72px; padding: 0; text-align: center;
    font-size: 26px; border-radius: 14px; border: 3px solid var(--bleu);
    background: #EAF2FB; min-height: 64px;
  }
  .ecoute-mini {
    width: 56px; min-width: 56px; min-height: 48px; padding: 0; margin-right: 10px;
    display: inline-block; text-align: center; font-size: 22px;
    border-radius: 12px; border: 3px solid var(--bleu); background: #EAF2FB; vertical-align: middle;
  }
  .voix { background: #EAF2FB; border: 2px solid var(--bleu); border-radius: 14px; padding: 8px 12px; margin-bottom: 14px; }
  .voix .titre-voix { font-weight: bold; margin-right: 8px; }
  button.actif { background: var(--bleu); color: #FFFFFF; }
  input[type=text] {
    font-family: inherit; font-size: 22px; padding: 12px 14px; width: 100%;
    border: 3px solid var(--bleu); border-radius: 12px; margin: 8px 0 14px;
  }
  .mots dt { font-weight: bold; color: var(--bleu); margin-top: 12px; }
  .mots dd { margin: 0 0 6px 0; }
  .bilan li { margin-bottom: 10px; }
</style>
</head>
<body>
<main>
  <header class="titre">
    <h1>🧪 Effets et conséquences</h1>
    <p>Je fais les missions sur la tablette. <span class="modalite">🧑 Je travaille seul(e).</span></p>

  <div class="voix" id="voix"></div>

</main>

      { icone: "🍾🚬", mot: "Définition", q: "Qu'est-ce que la polyconsommation ?",
        juste: "La polyconsommation, c'est consommer plusieurs produits en même temps.",
        faux: ["La polyconsommation, c'est consommer un seul produit pendant très longtemps.",
               "La polyconsommation, c'est arrêter de consommer tous les produits."],
        aide: "« Poly » veut dire « plusieurs ».", bilan: "Consommer plusieurs produits en même temps." },
      { icone: "🍾🚬🍃", mot: "Résultat", q: "Quand on mélange l'alcool, le tabac et le cannabis, que se passe-t-il ?",
        juste: "Les effets augmentent et les risques pour la santé sont plus graves.",
        faux: ["Les effets se compensent et les risques pour la santé diminuent.",
               "Rien ne change, car chaque produit agit tout seul."],
        aide: "Regarde la flèche qui monte à droite du document.", bilan: "Les effets augmentent et les risques sont plus graves." }
    ]

  {
    titre: "Mission 3 — Les conséquences dans la vie",
    consigne: "Je lis chaque scène. Je choisis la conséquence qui correspond.",
    items: [
      { icone: "🚗💥", mot: "Scène 1", q: "Deux voitures sont très abîmées après un choc. Quelle conséquence est-ce ?",

      { icone: "😔", mot: "Scène 2", q: "Une jeune fille reste seule, à l'écart de ses amies. Quelle conséquence est-ce ?",
        juste: "L'isolement.", faux: ["Des problèmes financiers.", "Un accident de travail."], aide: "Elle n'est plus avec les autres.", bilan: "L'isolement." },
      { icone: "💸", mot: "Scène 3", q: "Un jeune homme regarde son portefeuille vide, et l'argent s'envole. Quelle conséquence est-ce ?",
        juste: "Des problèmes financiers.", faux: ["De la violence.", "Des conflits familiaux."], aide: "Pense à l'argent.", bilan: "Des problèmes financiers." },
      { icone: "😢", mot: "Scène 4", q: "Une fille se bouche les oreilles pendant que des adultes se disputent. Quelle conséquence est-ce ?",

      { icone: "👊", mot: "Scène 5", q: "Un jeune est à terre, frappé par un groupe. Quelle conséquence est-ce ?",

      { icone: "📦", mot: "Scène 6", q: "Un employé quitte son bureau avec ses affaires dans un carton. Quelle conséquence est-ce ?",
        juste: "Un licenciement.", faux: ["Des problèmes de santé.", "Des conflits familiaux."], aide: "Il perd son emploi.", bilan: "Un licenciement." },
      { icone: "🦺", mot: "Scène 7", q: "Un ouvrier est allongé au sol, à côté de son casque de chantier. Quelle conséquence est-ce ?",
        juste: "Un accident de travail.", faux: ["Un accident de la route.", "Des problèmes financiers."], aide: "Il porte un casque de chantier.", bilan: "Un accident de travail." },
      { icone: "🌙⏰", mot: "Scène 8", q: "Une personne ne dort pas : son réveil indique qu'il fait nuit. Quelle conséquence est-ce ?",
        juste: "Des insomnies.", faux: ["De la violence.", "Un licenciement."], aide: "Elle n'arrive pas à dormir.", bilan: "Des insomnies." },
      { icone: "🏥", mot: "Scène 9", q: "Un homme est assis sur un lit d'hôpital, la tête dans les mains. Quelle conséquence est-ce ?",
        juste: "Des problèmes de santé.", faux: ["Un accident de la route.", "L'isolement."], aide: "Il est à l'hôpital.", bilan: "Des problèmes de santé." }
    ]
  },
  {
    titre: "Mission 4 — Retour à Benjamin",
    consigne: "Je repense à l'histoire de Benjamin, le couvreur.",
    items: [
      { icone: "🕵️", mot: "Benjamin", q: "Benjamin a fumé un joint avant de monter sur le toit. Quelle conséquence voit-on dans l'histoire ?",
        juste: "Un accident de travail : son collègue est assommé par la bouteille de gaz.",
        faux: ["Un accident de la route : il a eu un choc en voiture.", "Des problèmes financiers : il a perdu tout son argent."],
        aide: "Que se passe-t-il sur le chantier ?", bilan: "Un accident de travail : son collègue est assommé par la bouteille de gaz." }
    ]
  }
];

/* ---------- Outils ---------- */
var ecran = document.getElementById("ecran");
var prenom = "";
var iMission = 0;
var iItem = 0;
var vitesse = 0.9;
var VITESSE_LENTE = 0.65;

function peutLire() { try { return "speechSynthesis" in window; } catch (e) { return false; } }
function arreter() { try { if (peutLire()) { window.speechSynthesis.cancel(); } } catch (e) {} }
function lire(texte) {
  try {
    if (!peutLire()) { return; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(texte);
    u.lang = "fr-FR";
    u.rate = vitesse;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
function melanger(liste) {
  var t = liste.slice();
  for (var i = t.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var x = t[i]; t[i] = t[j]; t[j] = x;
  }
  return t;
}
function el(tag, classe, html) {
  var e = document.createElement(tag);
  if (classe) { e.className = classe; }
  if (html !== undefined) { e.innerHTML = html; }
  return e;
}
function vider() { arreter(); ecran.innerHTML = ""; window.scrollTo(0, 0); }

function boutonEcoute(texte, mini, etiquette) {
  var b = el("button", mini ? "ecoute-mini" : "ecoute", "🔊");
  b.type = "button";
  b.setAttribute("aria-label", etiquette || "Écouter");
  b.title = etiquette || "Écouter";
  b.onclick = function (ev) { ev.stopPropagation(); lire(texte); };
  return b;
}

function construireBarreVoix() {
  var zone = document.getElementById("voix");
  zone.innerHTML = "";
  if (!peutLire()) {
    zone.appendChild(el("span", "", "🔇 La lecture à voix haute n'est pas disponible sur cet appareil."));
    return;
  }
  zone.appendChild(el("span", "titre-voix", "🔊 La voix :"));
  var bLent = el("button", "petit", "🐢 Lente");
  var bNormal = el("button", "petit", "🙂 Normale");
  var bStop = el("button", "petit", "⏹️ Arrêter");
  function maj() {
    bLent.className = "petit" + (vitesse === VITESSE_LENTE ? " actif" : "");
    bNormal.className = "petit" + (vitesse !== VITESSE_LENTE ? " actif" : "");
  }
  bLent.onclick = function () { vitesse = VITESSE_LENTE; maj(); lire("Je lis lentement."); };
  bNormal.onclick = function () { vitesse = 0.9; maj(); lire("Je lis normalement."); };
  bStop.onclick = arreter;
  maj();
  zone.appendChild(bLent); zone.appendChild(bNormal); zone.appendChild(bStop);
}

/* ---------- Écrans ---------- */
function afficherAccueil() {
  vider();
  var c = el("section", "carte");
  c.appendChild(el("h2", "", "Bienvenue, enquêteur !"));
  var intro = "Tu vas découvrir ce que les produits font au corps, et ce qu'ils changent dans la vie.";
  var p = el("p", "", "");
  if (peutLire()) { p.appendChild(boutonEcoute(intro, true, "Écouter le texte")); }
  p.appendChild(document.createTextNode(intro));
  c.appendChild(p);
  c.appendChild(el("p", "", "<strong>Mon prénom :</strong>"));
  var champ = el("input");
  champ.type = "text";
  champ.setAttribute("aria-label", "Mon prénom");
  champ.autocomplete = "off";
  c.appendChild(champ);
  var b = el("button", "principal", "Voir les mots importants ➜");
  b.onclick = function () { prenom = champ.value.trim(); afficherMots(); };
  c.appendChild(b);
  ecran.appendChild(c);
}

function afficherMots() {
  vider();
  var c = el("section", "carte");
  c.appendChild(el("h2", "", "📚 Les mots importants"));
  c.appendChild(el("p", "", "👩‍🏫 Ton professeur t'explique ces mots. Tu peux aussi les écouter."));
  var dl = el("dl", "mots");
  var tout = "";
  MOTS.forEach(function (m) {
    var dt = el("dt", "");
    if (peutLire()) { dt.appendChild(boutonEcoute(m[0] + ". " + m[1], true, "Écouter ce mot")); }
    dt.appendChild(document.createTextNode(m[0]));
    dl.appendChild(dt);
    dl.appendChild(el("dd", "", m[1]));
    tout += m[0] + ". " + m[1] + " ";
  });
  c.appendChild(dl);
  if (peutLire()) {
    var bt = el("button", "petit", "🔊 Écouter tous les mots");
    bt.onclick = function () { lire(tout); };
    c.appendChild(bt);
  }
  ecran.appendChild(c);
  var suite = el("button", "principal", "Je commence les missions ➜");
  suite.onclick = function () { iMission = 0; afficherIntroMission(); };
  ecran.appendChild(suite);
}

function afficherIntroMission() {
  vider();
  var M = MISSIONS[iMission];
  var c = el("section", "carte");
  c.appendChild(el("h2", "", M.titre));
  var p = el("p", "", "");
  if (peutLire()) { p.appendChild(boutonEcoute(M.titre + ". " + M.consigne, true, "Écouter la consigne")); }
  p.appendChild(document.createTextNode(M.consigne));
  c.appendChild(p);
  ecran.appendChild(c);
  var b = el("button", "principal", "C'est parti ➜");
  b.onclick = function () { iItem = 0; afficherItem(); };
  ecran.appendChild(b);
}

function afficherItem() {
  vider();
  var M = MISSIONS[iMission];
  var Q = M.items[iItem];

  var barre = el("div", "barre");
  for (var i = 0; i < M.items.length; i++) {
    barre.appendChild(el("span", i < iItem ? "fait" : (i === iItem ? "courant" : "")));
  }
  ecran.appendChild(barre);

  var c = el("section", "carte");
  c.appendChild(el("div", "scene", Q.icone));
  c.appendChild(el("div", "mot", Q.mot));
  if (M.image) {
    var im = document.createElement("img");
    im.src = M.image;
    im.alt = "Document : une bouteille d'alcool plus une cigarette, puis une bouteille d'alcool plus une cigarette plus du cannabis. Résultat : augmentation des effets et risques plus graves pour la santé.";
    im.style.cssText = "width:100%;max-width:640px;display:block;margin:10px auto;border:2px solid #ccc;border-radius:12px;background:#fff";
    c.appendChild(im);
  }
  var enonce;
  if (Q.texte) {
    c.appendChild(el("div", "temoignage", Q.texte));
    c.appendChild(el("h2", "", "Cet effet arrive-t-il tout de suite ou après longtemps ?"));
    enonce = Q.texte + " Cet effet arrive-t-il tout de suite ou après longtemps ?";
  } else {
    c.appendChild(el("h2", "", Q.q));
    enonce = Q.q;
  }

  var options = M.fixe ? [IMMEDIAT, LONG] : melanger([Q.juste].concat(Q.faux));

  if (peutLire()) {
    var bl = el("button", "petit", "🔊 Écouter la question et les réponses");
    bl.onclick = function () {
      var t = enonce;
      options.forEach(function (o, k) { t += " Réponse " + (k + 1) + ". " + o; });
      lire(t);
    };
    c.appendChild(bl);
  }

  var retour = el("div", "retour");
  retour.setAttribute("aria-live", "polite");
  var boutons = [];

  options.forEach(function (texte) {
    var ligne = el("div", "ligne");
    var b = el("button", "reponse", texte);
    b.onclick = function () {
      if (texte === Q.juste) {
        b.className = "reponse juste";
        retour.className = "retour ok";
        retour.textContent = "✅ Oui, bravo !";
        boutons.forEach(function (x) { x.disabled = true; });
        suivant.className = "principal";
        suivant.style.display = "block";
        lire("Oui, bravo !");
      } else {
        b.className = "reponse faux";
        b.disabled = true;
        retour.className = "retour non";
        retour.textContent = "Pas tout à fait. Relis, puis essaie une autre réponse.";
        lire("Pas tout à fait. Relis, puis essaie une autre réponse.");
      }
    };
    boutons.push(b);
    ligne.appendChild(b);
    if (peutLire()) { ligne.appendChild(boutonEcoute(texte, false, "Écouter cette réponse")); }
    c.appendChild(ligne);
  });
  c.appendChild(retour);

  var aide = el("div", "aide cache", "");
  aide.appendChild(el("span", "", "💡 <strong>Aide :</strong> " + Q.aide));
  if (peutLire()) { aide.appendChild(document.createTextNode(" ")); aide.appendChild(boutonEcoute("Aide. " + Q.aide, true, "Écouter l'aide")); }
  var ba = el("button", "petit", "💡 J'ai besoin d'une aide");
  ba.onclick = function () { aide.className = "aide"; ba.style.display = "none"; };
  c.appendChild(ba);
  c.appendChild(aide);
  ecran.appendChild(c);

  var dernier = (iItem === M.items.length - 1);
  var suivant = el("button", "", dernier ? "Voir ce que j'ai trouvé ➜" : "Question suivante ➜");
  suivant.style.display = "none";
  suivant.onclick = function () {
    iItem++;
    if (iItem < M.items.length) { afficherItem(); } else { afficherBilanMission(); }
  };
  ecran.appendChild(suivant);
}

function afficherBilanMission() {
  vider();
  var M = MISSIONS[iMission];
  var c = el("section", "carte");
  c.appendChild(el("h2", "", "✅ " + M.titre + " : terminée"));
  c.appendChild(el("p", "", "Voici ce que tu as trouvé :"));
  var liste = el("ul", "bilan");
  var texteLu = "Voici ce que tu as trouvé. ";
  M.items.forEach(function (Q) {
    liste.appendChild(el("li", "", "<strong>" + Q.icone + " " + Q.mot + " :</strong> " + Q.bilan));
    texteLu += Q.mot + ". " + Q.bilan + " ";
  });
  c.appendChild(liste);
  if (peutLire()) {
    var bf = el("button", "petit", "🔊 Écouter ce que j'ai trouvé");
    bf.onclick = function () { lire(texteLu); };
    c.appendChild(bf);
  }
  ecran.appendChild(c);
  var dernierMission = (iMission === MISSIONS.length - 1);
  var b = el("button", "principal", dernierMission ? "Terminer ➜" : "Mission suivante ➜");
  b.onclick = function () {
    iMission++;
    if (iMission < MISSIONS.length) { afficherIntroMission(); } else { afficherFin(); }
  };
  ecran.appendChild(b);
}

function afficherFin() {
  vider();
  var c = el("section", "carte");
  var nom = prenom ? (" " + prenom) : "";
  c.appendChild(el("h2", "", "🎉 Bravo" + nom + " !"));
  c.appendChild(el("p", "", "Tu as terminé les 4 missions : les effets immédiats et à long terme, la polyconsommation, les conséquences dans la vie, et Benjamin."));
  c.appendChild(el("p", "", "👩‍🏫 <strong>Tu peux maintenant écouter ton professeur, puis passer à ton plan de travail.</strong>"));
  if (peutLire()) {
    var bf = el("button", "petit", "🔊 Écouter");
    bf.onclick = function () { lire("Bravo" + nom + ". Tu as terminé les quatre missions. Tu peux maintenant écouter ton professeur, puis passer à ton plan de travail."); };
    c.appendChild(bf);
  }
  ecran.appendChild(c);
  var b = el("button", "petit", "↩️ Revoir les mots importants");
  b.onclick = afficherMots;
  ecran.appendChild(b);
}

construireBarreVoix();
afficherAccueil();
</script>
</body>
</html>
